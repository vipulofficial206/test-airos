name: airos-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    - numpy>=1.24.0,<2.0.0
    - opencv-python>=4.8.0
    - torch>=2.0.0
    - torchvision>=0.15.0
    - ultralytics>=8.0.0
    - pyautogui>=0.9.54
    - pycaw>=20230407; platform_system == 'Windows'
    - comtypes; platform_system == 'Windows'
    - screen-brightness-control>=0.17.0
    - psutil>=5.9.0
    - pyyaml>=6.0
    - jsonschema>=4.17.0
    - pytest>=7.4.0
    - pytest-asyncio>=0.21.0
